<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script type="module" src="./assets/js/module.js" defer></script>
  </head>
  <body id="cuerpo">
    <p id="parrafo-ej1"></p>
    <input id="input-ej1" type="text">
    <button id="boton-ej1">Ejercicio 1</button>
    <hr>
    <ul id="lista-ej3"></ul>
    <hr>
    <button id="boton-ej4">Cambiar modo</button>
<section>
  <h2>Ejercicio 7 - Calculadora</h2>

  <input type="number" id="input-ej7-A" placeholder="Primer número" />

  <select id="select-ej7">
    <option value="sumar">Sumar</option>
    <option value="restar">Restar</option>
    <option value="multiplicar">Multiplicar</option>
    <option value="dividir">Dividir</option>
  </select>

  <input type="number" id="input-ej7-B" placeholder="Segundo número" />

  <button id="boton-ej7">Calcular</button>
  <p id="resultado-ej7"></p>
</section>

<section>
  <h2>Ejercicio 8 - Inversor de nombres</h2>

  <input type="text" id="input-ej8" placeholder="Nombre completo" />
  <button id="boton-ej8">Invertir nombre</button>
  <p id="resultado-ej8"></p>
</section>

<section>
  <h2>Ejercicio 9 - Tabla de multiplicar</h2>

  <input type="number" id="input-ej9" placeholder="Introduce un número" />
  <button id="boton-ej9">Generar tabla</button>

  <p id="mensaje-ej9"></p>

  <table>
    <thead>
      <tr>
        <th>Operación</th>
        <th>Resultado</th>
      </tr>
    </thead>
    <tbody id="tabla-ej9"></tbody>
  </table>
</section>

<section>
  <h2>Ejercicio 10 - Capitalizador de palabras</h2>
  <p id="resultado-ej10"></p>
</section>
  </body>
</html>
